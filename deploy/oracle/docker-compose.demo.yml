# Overlay for the public demo instance: adds a rate-limited nginx reverse
# proxy in front of the gateway (see nginx-demo.conf.template) and gives
# every service a restart policy for VM reboots.
#
# Usage: docker compose -f docker-compose.yml -f deploy/oracle/docker-compose.demo.yml up -d --build
services:
  demo-proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/oracle/nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/oracle/demo-web:/usr/share/nginx/html:ro
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

  gateway:
    restart: unless-stopped
  input-defense:
    restart: unless-stopped
  output-defense:
    restart: unless-stopped
  policy-engine:
    restart: unless-stopped
  model-router:
    restart: unless-stopped
  agent-gate:
    restart: unless-stopped
  audit:
    restart: unless-stopped
  postgres:
    restart: unless-stopped
