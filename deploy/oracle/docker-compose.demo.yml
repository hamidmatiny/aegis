# Overlay for the public demo instance: adds a rate-limited nginx reverse
# proxy in front of the gateway (see nginx-demo.conf.template) and gives
# every service a restart policy for VM reboots.
#
# Usage: docker compose -f docker-compose.yml -f deploy/oracle/docker-compose.demo.yml up -d --build
services:
  demo-proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/oracle/nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/oracle/demo-web:/usr/share/nginx/html:ro
      # Stage C.1: only ever referenced by the rendered config if
      # deploy/oracle/tls/origin.pem + origin-key.pem exist at setup.sh
      # render time (see nginx-demo.conf.template) -- an empty/missing
      # directory here is harmless, nothing in the plain-HTTP config path
      # points at it. setup.sh creates this directory unconditionally so
      # the mount source always exists rather than relying on Docker's
      # own auto-create-on-missing-bind-source behavior.
      - ./deploy/oracle/tls:/etc/nginx/tls:ro
    depends_on:
      gateway:
        condition: service_started
      agent-gate:
        condition: service_started
      smb-copilot:
        condition: service_started
      smb-portal:
        condition: service_started
      corp-orchestrator:
        condition: service_started
    restart: unless-stopped

  gateway:
    restart: unless-stopped
  input-defense:
    restart: unless-stopped
  output-defense:
    restart: unless-stopped
  policy-engine:
    restart: unless-stopped
  model-router:
    restart: unless-stopped
  agent-gate:
    restart: unless-stopped
  audit:
    restart: unless-stopped
    environment:
      # Public key discovery for the live demo. Public keys only; receipts stay authenticated.
      AEGIS_AUDIT_PUBLIC_KEYS: ${AEGIS_AUDIT_PUBLIC_KEYS:-true}
      AEGIS_AUDIT_KEYS_URI: ${AEGIS_AUDIT_KEYS_URI:-https://defenseaegis.org/.well-known/jwks.json}
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped

  smb-copilot:
    restart: unless-stopped
    environment:
      SMB_COOKIE_SECURE: ${SMB_COOKIE_SECURE:-true}
      SMB_COOKIE_PATH: ${SMB_COOKIE_PATH:-/}

  corp-orchestrator:
    restart: unless-stopped
    environment:
      # First prod cutover: mock LLM + scheduler off until owner enables spend.
      CORP_FORCE_MOCK_LLM: ${CORP_FORCE_MOCK_LLM:-true}
      CORP_SCHEDULER_ENABLED: ${CORP_SCHEDULER_ENABLED:-false}
      # Empty = all agents. CEO-only free-tier cutover: executive/ceo
      CORP_SCHEDULER_ALLOWLIST: ${CORP_SCHEDULER_ALLOWLIST:-}
      CORP_HEALTHZ_URL: ${CORP_HEALTHZ_URL:-http://smb-copilot:8093/healthz}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID_STANDARD: ${STRIPE_PRICE_ID_STANDARD:-}

  smb-portal:
    restart: unless-stopped
    build:
      context: .
      dockerfile: smb-portal/Dockerfile
      args:
        VITE_BASE_PATH: /
        VITE_API_BASE: /api/smb
