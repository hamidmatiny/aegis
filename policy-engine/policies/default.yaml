# Default policy pack for AEGIS
id: default
version: "0.2.0"
tenant_id: default
description: Baseline CEL policy pack — input, output, and tool rules

input_rules:
  - id: block-high-fusion-score
    name: Block high input fusion score
    cel: "input_verdict.fused_score >= 0.85"
    action: block
    enabled: true

  - id: escalate-ambiguous-input
    name: Escalate ambiguous input
    cel: "input_verdict.fused_score >= 0.55 && input_verdict.fused_score < 0.85"
    action: escalate_to_judge
    enabled: true

  - id: transform-spotlighting-applied
    name: Transform when input defense produced rewritten content
    cel: "input_verdict.transformed_content != ''"
    action: transform
    enabled: true
    transform_spec: "use_input_verdict.transformed_content"

  - id: block-heuristic-critical
    name: Block when heuristic detector is highly confident
    cel: "input_verdict.detector_scores.exists(d, d.detector_id == 'heuristic' && d.score >= 0.85)"
    action: block
    enabled: true

output_rules:
  - id: block-high-output-score
    name: Block high output fusion score
    cel: "output_verdict.fused_score >= 0.80"
    action: block
    enabled: true

  - id: escalate-ambiguous-output
    name: Escalate ambiguous output
    cel: "output_verdict.fused_score >= 0.50 && output_verdict.fused_score < 0.80"
    action: escalate_to_judge
    enabled: true

  - id: block-critical-pii-leak
    name: Block when the PII/secret detector is highly confident
    cel: "output_verdict.detector_scores.exists(d, d.detector_id == 'pii' && d.score >= 0.85)"
    action: block
    enabled: true

tool_rules:
  - id: require-approval-irreversible
    name: Require human approval for irreversible actions
    cel: "tool_call.risk_level == 'IRREVERSIBLE'"
    action: escalate_to_judge
    enabled: true

  # Stage E.1: triggers on contains_credentials alone. It used to also
  # require taint_level == 'TAINTED', which meant a caller that never
  # explicitly declared TAINTED (the normal case -- nothing in this
  # repo's examples or SDKs sets it by default) could get a real,
  # server-detected credential (agent-gate/internal/mask.go's regex
  # detection, which runs on every argument's actual value regardless of
  # what the caller claims) approved anyway, since contains_credentials
  # alone didn't satisfy this rule's old AND condition. A live credential
  # in an argument is grounds to block on its own -- the surrounding
  # taint context doesn't make a leaked API key less of one. mask.go is
  # also fixed (Stage E.1) to correctly report TAINTED, not just
  # UNTRUSTED, in this situation, so this rule is now redundant with that
  # fix in the common case -- kept broad anyway as defense in depth
  # against any future code path that sets contains_credentials without
  # going through mask.go's escalation.
  - id: block-tainted-credentials
    name: Block tool arguments containing detected credentials
    cel: "tool_call.arguments.exists(a, a.contains_credentials)"
    action: block
    enabled: true

# tool_catalog is the operator-registered, authoritative risk level per
# tool_name. The engine takes the higher of (caller-declared risk_level,
# catalog risk_level) — see policy-engine/internal/engine/risk.go — so a
# caller cannot bypass the human-approval rule above just by claiming a
# lower risk_level for a tool that's registered here. Register any tool
# whose misuse would be destructive, irreversible, or high-blast-radius.
tool_catalog:
  - tool_name: delete_database
    risk_level: IRREVERSIBLE
  - tool_name: drop_database
    risk_level: IRREVERSIBLE
  - tool_name: drop_table
    risk_level: IRREVERSIBLE
  - tool_name: delete_user
    risk_level: IRREVERSIBLE
  - tool_name: revoke_all_access
    risk_level: IRREVERSIBLE
  - tool_name: wire_transfer
    risk_level: IRREVERSIBLE
  - tool_name: send_email
    risk_level: MEDIUM
  - tool_name: post_message
    risk_level: MEDIUM
  - tool_name: search_docs
    risk_level: LOW
  # Operator-platform phase 2 (harness/ tools/skills library additions) --
  # registered here for the same reason every entry above is: their
  # misuse is a real, known agent-security risk class (network
  # exfiltration/SSRF, file-read recon, file-write integrity impact),
  # even though the harness's own starter implementations are sandboxed
  # (domain-allowlisted / confined to a local sandbox directory). The
  # catalog reflects the tool's real-world risk, not how safely this
  # particular demo implementation happens to be built -- see
  # harness/src/aegis_harness/tools/{http_get,read_file,write_file}.py.
  - tool_name: http_get
    risk_level: MEDIUM
  - tool_name: read_file
    risk_level: MEDIUM
  - tool_name: write_file
    risk_level: HIGH

settings:
  shadow_mode: false
  default_action: allow
