server {
    listen 3001;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets — safe to cache hard. Missing files must 404 (not SPA fallback),
    # otherwise a stale index.html pointing at an old hash silently loads HTML as JS.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Favicons / OG image — short edge-friendly cache
    location ~* \.(ico|png|svg|webp)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /api/smb/ {
        proxy_pass http://smb-copilot:8093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA shell — never let browsers/CDNs keep a stale index.html after deploys
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SEO: serve route-specific HTML shells (correct title/canonical in page source)
    location = /guides/smb-cve-exposure-checklist {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files /guides/smb-cve-exposure-checklist/index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
