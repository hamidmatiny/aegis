server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # __AUTH_BASIC__ "AEGIS Dashboard (dev)";
    # __AUTH_BASIC_FILE__ /etc/nginx/.htpasswd;

    location /api/audit/ {
        proxy_pass http://audit:8084/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api/policy/ {
        proxy_pass http://policy-engine:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Deciding an approval requires the reviewer key, not the service key
    # used below for everything else — this regex location is checked
    # ahead of the plain /api/agent-gate/ prefix location regardless of
    # file order (nginx always prefers a matching regex location over a
    # non "^~" prefix location).
    location ~ ^/api/agent-gate/v1/approvals/[^/]+/decide$ {
        rewrite ^/api/agent-gate/(.*)$ /$1 break;
        proxy_pass http://agent-gate:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer __AGENT_GATE_REVIEWER_KEY__";
    }

    location /api/agent-gate/ {
        rewrite ^/api/agent-gate/(.*)$ /$1 break;
        proxy_pass http://agent-gate:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization "Bearer __AGENT_GATE_SERVICE_KEY__";
    }

    location /api/redteam/ {
        proxy_pass http://redteam:8092/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
