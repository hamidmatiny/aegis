[project]
name = "aegis-smb-copilot"
version = "0.1.0"
description = "AEGIS SMB Copilot service (scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "redis>=5.0.0",
    "bcrypt>=4.2.0",
    # Cap the major range. Production hit a StripeObject behavior change in
    # stripe-python 15.x (Session no longer dict()-able); unbounded ">=11"
    # silently pulled that in. Allow current 15.x with the .to_dict() fix;
    # re-verify before jumping to 16+.
    "stripe>=11.0.0,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_smb_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aegis_smb_copilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
