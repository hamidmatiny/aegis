name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catch newly-disclosed CVEs in already-merged dependencies, not just new PRs.
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  osv-scanner:
    name: OSV dependency scan
    # Google-maintained reusable workflow: scans all supported manifests and
    # lockfiles recursively, then uploads SARIF to GitHub Code Scanning.
    # Keep this report-only until findings across the monorepo are triaged,
    # matching govulncheck, pip-audit, and npm-audit below.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0
    with:
      fail-on-vuln: false

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, policy-engine, model-router, agent-gate, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan ${{ matrix.service }}
        # Report-only for this initial rollout: we don't yet have a triaged
        # baseline of pre-existing findings across 5 services, so this
        # shouldn't hard-block CI until that baseline exists. Findings are
        # still visible in the job log and in the Security tab.
        continue-on-error: true
        run: cd ${{ matrix.service }} && govulncheck ./...

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [input-defense, output-defense, redteam, sdk/python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Install ${{ matrix.service }}
        run: pip install -e "./${{ matrix.service }}"
      - name: Audit ${{ matrix.service }}
        # pip-audit with no --path/--requirement scans the currently active
        # environment, which now has this service's deps installed.
        # Report-only for this initial rollout — see govulncheck note above.
        continue-on-error: true
        run: pip-audit --desc

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [dashboard, sdk/typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: cd ${{ matrix.project }} && npm install
      - name: Audit (high+ severity)
        # Report-only for this initial rollout — see govulncheck note above.
        continue-on-error: true
        run: cd ${{ matrix.project }} && npm audit --audit-level=high

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM for the repo
        # Use Anchore's maintained action, as release.yml does. The removed
        # curl|sh installer performs an unauthenticated latest-release lookup
        # that flakes under GitHub Actions network load.
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
