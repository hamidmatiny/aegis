name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.22"
  PYTHON_VERSION: "3.12"
  # Fast CI: never download ~1GB ML weights on every PR.
  AEGIS_INPUT_DEFENSE_CLASSIFIER_BACKEND: stub
  AEGIS_INPUT_DEFENSE_PERPLEXITY_BACKEND: stub
  AEGIS_OUTPUT_DEFENSE_TOXICITY_BACKEND: stub
  AEGIS_OUTPUT_DEFENSE_PII_BACKEND: regex
  AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_BACKEND: stub
  AEGIS_OUTPUT_DEFENSE_JUDGE_BACKEND: stub

jobs:
  proto:
    name: Protobuf lint & codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Without this, buf-setup-action resolves its download URL via an
          # unauthenticated GitHub API call, sharing the anonymous 60/hr
          # rate limit across every GitHub-hosted runner on the internet --
          # a known, unrelated-to-this-repo flake (the failure this fixes:
          # "API rate limit exceeded for <runner IP>"). GITHUB_TOKEN is the
          # workflow's own automatically-provided token, not a new secret.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint protobuf
        run: cd shared && buf lint
      - name: Generate code
        run: cd shared && buf generate

  jsonschema:
    name: JSON Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate schemas
        run: |
          npm install --no-save ajv@8 ajv-formats
          node scripts/validate-jsonschemas.mjs

  go:
    name: Go lint & test
    runs-on: ubuntu-latest
    needs: [proto]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            gateway/go.sum
            policy-engine/go.sum
            model-router/go.sum
            agent-gate/go.sum
            audit/go.sum
            shared/gen/go/go.sum
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate protobuf
        run: cd shared && buf generate
      - name: Download gen/go modules
        run: cd shared/gen/go && go mod download
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - name: Lint
        run: make lint-go
      - name: Test
        run: make test-go

  python:
    name: Python lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          for dir in input-defense output-defense redteam sdk/python; do
            pip install -e "./$dir[dev]"
          done
      - name: Lint
        run: make lint-python
      - name: Test
        run: make test-python

  ml-smoke:
    name: ML smoke (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install input-defense ML extras
        run: pip install -e "./input-defense[ml,dev]"
      - name: Run input-defense real-model smoke tests
        run: cd input-defense && pytest tests/test_ml_backends.py -s
      - name: Install output-defense ML extras
        run: |
          pip install -e "./output-defense[ml,dev]"
          python -m spacy download en_core_web_sm
      - name: Run output-defense real-model smoke tests
        run: cd output-defense && pytest tests/test_ml_backends.py -s

  integration:
    name: Integration smoke tests
    runs-on: ubuntu-latest
    needs: [go, python]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Oracle demo canary config (Stage 2 safe-redirect rule)
        # Docker-independent, so it runs before the stack comes up. Neither
        # script was wired into any test runner before this -- they existed
        # in the repo but nothing ever executed them.
        run: |
          chmod +x deploy/oracle/tests/test_canary.sh deploy/oracle/tests/test_canary_render.sh
          ./deploy/oracle/tests/test_canary.sh
          ./deploy/oracle/tests/test_canary_render.sh
      - name: Start stack
        env:
          # Keep integration fast: no live LLM calls on container startup paths.
          AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_BACKEND: stub
          AEGIS_OUTPUT_DEFENSE_JUDGE_BACKEND: stub
          # There is no static default credential in the repo. CI sets its
          # own throwaway test credentials explicitly, the same way any
          # real deployment must (see scripts/generate-credentials.sh).
          AEGIS_DASHBOARD_USER: ci-admin
          AEGIS_DASHBOARD_PASSWORD: ci-test-password-not-a-secret
          AEGIS_API_KEYS: ci-test-api-key-not-a-secret
          AEGIS_AGENT_GATE_API_KEYS: ci-test-agent-gate-key-not-a-secret
          AEGIS_AGENT_GATE_REVIEWER_KEYS: ci-test-agent-gate-reviewer-key-not-a-secret
          # Shared internal service-to-service token (policy-engine,
          # audit, input-defense, output-defense all refuse to start
          # without it now).
          AEGIS_INTERNAL_TOKEN: ci-test-internal-token-not-a-secret
          # SMB Copilot session signing (Phase 9); required at compose
          # interpolation time — same throwaway pattern as above.
          SMB_SESSION_SECRET: ci-test-smb-session-secret-not-a-secret
        run: docker compose up -d --build --wait
      - name: Run smoke tests
        env:
          AEGIS_DASHBOARD_USER: ci-admin
          AEGIS_DASHBOARD_PASSWORD: ci-test-password-not-a-secret
          AEGIS_API_KEYS: ci-test-api-key-not-a-secret
          AEGIS_AGENT_GATE_API_KEYS: ci-test-agent-gate-key-not-a-secret
          AEGIS_AGENT_GATE_REVIEWER_KEYS: ci-test-agent-gate-reviewer-key-not-a-secret
          AEGIS_INTERNAL_TOKEN: ci-test-internal-token-not-a-secret
          # scripts/integration invokes docker compose for health checks.
          SMB_SESSION_SECRET: ci-test-smb-session-secret-not-a-secret
        run: |
          chmod +x scripts/integration
          ./scripts/integration
      - name: Tear down
        if: always()
        env:
          # compose uses ${AEGIS_INTERNAL_TOKEN:?...} — interpolation still
          # runs on `down`, so the token must be present here too.
          AEGIS_INTERNAL_TOKEN: ci-test-internal-token-not-a-secret
          SMB_SESSION_SECRET: ci-test-smb-session-secret-not-a-secret
        run: docker compose down -v

  chaos:
    name: Chaos / fault-injection tests
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        env:
          # Same throwaway CI credentials as the integration job.
          AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_BACKEND: stub
          AEGIS_OUTPUT_DEFENSE_JUDGE_BACKEND: stub
          AEGIS_DASHBOARD_USER: ci-admin
          AEGIS_DASHBOARD_PASSWORD: ci-test-password-not-a-secret
          AEGIS_API_KEYS: ci-test-api-key-not-a-secret
          AEGIS_AGENT_GATE_API_KEYS: ci-test-agent-gate-key-not-a-secret
          AEGIS_AGENT_GATE_REVIEWER_KEYS: ci-test-agent-gate-reviewer-key-not-a-secret
          AEGIS_INTERNAL_TOKEN: ci-test-internal-token-not-a-secret
          SMB_SESSION_SECRET: ci-test-smb-session-secret-not-a-secret
        run: docker compose up -d --build --wait
      - name: Run chaos / fault-injection tests
        # Unlike the benchmark job, this is pass/fail correctness against
        # the contract documented in FAILURE_MODES.md -- a failure here
        # fails the build.
        #
        # AEGIS_INTERNAL_TOKEN must be set here too, same reason as the
        # Tear down step below: `docker compose stop/start` still has to
        # interpolate the whole compose file first (AEGIS_INTERNAL_TOKEN
        # is a required `${...:?...}` value on 8 services), even though
        # stop/start themselves never send it to a container.
        env:
          AEGIS_API_KEYS: ci-test-api-key-not-a-secret
          AEGIS_AGENT_GATE_API_KEYS: ci-test-agent-gate-key-not-a-secret
          AEGIS_INTERNAL_TOKEN: ci-test-internal-token-not-a-secret
          SMB_SESSION_SECRET: ci-test-smb-session-secret-not-a-secret
        run: |
          chmod +x scripts/chaos-test.sh
          ./scripts/chaos-test.sh
      - name: Tear down
        if: always()
        env:
          AEGIS_INTERNAL_TOKEN: ci-test-internal-token-not-a-secret
          SMB_SESSION_SECRET: ci-test-smb-session-secret-not-a-secret
        run: docker compose down -v

  benchmark:
    name: Benchmark harness
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - name: Install vegeta
        # Pinned version + checksum verification (no go toolchain is set
        # up in this job, and this repo doesn't otherwise depend on one
        # being present at benchmark time -- a single static binary from
        # a pinned, checksummed release is the simpler, more reproducible
        # option here). Bump VEGETA_VERSION deliberately, not silently via
        # @latest, so a benchmark regression can't come from vegeta itself
        # changing.
        env:
          VEGETA_VERSION: "12.13.0"
          VEGETA_SHA256: "e8759ce45c14e18374bdccd3ba6068197bc3a9f9b7e484db3837f701b9d12e61"
        run: |
          curl -fsSL -o vegeta.tar.gz \
            "https://github.com/tsenart/vegeta/releases/download/v${VEGETA_VERSION}/vegeta_${VEGETA_VERSION}_linux_amd64.tar.gz"
          echo "${VEGETA_SHA256}  vegeta.tar.gz" | sha256sum -c -
          tar -xzf vegeta.tar.gz vegeta
          sudo mv vegeta /usr/local/bin/vegeta
          vegeta -version
      - name: Start stack
        env:
          # Same throwaway CI credentials as the integration job -- see
          # that job's "Start stack" step for why these are hardcoded
          # here rather than pulled from a secret.
          AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_BACKEND: stub
          AEGIS_OUTPUT_DEFENSE_JUDGE_BACKEND: stub
          AEGIS_DASHBOARD_USER: ci-admin
          AEGIS_DASHBOARD_PASSWORD: ci-test-password-not-a-secret
          AEGIS_API_KEYS: ci-test-api-key-not-a-secret
          AEGIS_AGENT_GATE_API_KEYS: ci-test-agent-gate-key-not-a-secret
          AEGIS_AGENT_GATE_REVIEWER_KEYS: ci-test-agent-gate-reviewer-key-not-a-secret
          AEGIS_INTERNAL_TOKEN: ci-test-internal-token-not-a-secret
          SMB_SESSION_SECRET: ci-test-smb-session-secret-not-a-secret
        run: docker compose up -d --build --wait
      - name: Run benchmark
        env:
          AEGIS_API_KEYS: ci-test-api-key-not-a-secret
        run: |
          chmod +x scripts/benchmark.sh
          mkdir -p benchmark-results
          ./scripts/benchmark.sh
      - name: Tear down
        if: always()
        env:
          AEGIS_INTERNAL_TOKEN: ci-test-internal-token-not-a-secret
          SMB_SESSION_SECRET: ci-test-smb-session-secret-not-a-secret
        run: docker compose down -v
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
