# All published ports below are bound to 127.0.0.1 only (not 0.0.0.0), so
# these services are reachable from the host machine itself (SSH in and
# curl localhost:PORT works fine) but never from another machine on the
# network or the internet -- regardless of any cloud-provider firewall
# config. Only the reverse proxy in front of this stack (see
# deploy/oracle/docker-compose.demo.yml's demo-proxy, or your own ingress)
# should ever be reachable from outside the box. policy-engine,
# input-defense, output-defense, and audit now also enforce their own
# service-level auth via a shared AEGIS_INTERNAL_TOKEN (see
# scripts/generate-credentials.sh) -- they used to rely on this network
# isolation alone, which meant anything able to reach their port on the
# Docker network could call them directly with no credential at all.
#
# Every custom-built service below has both a `build:` block and an
# `image:` tag pointing at ghcr.io. `docker compose up -d --build` (what
# local development uses) still builds from source and tags the result
# with that same image name -- nothing changes there. But on a
# resource-constrained box (the free-tier Oracle VM this demo runs on
# has 1 vCPU / 1GB RAM and cannot reliably compile 5 Go services plus an
# npm build without heavy swap thrashing), `docker compose pull` fetches
# the already-built, signed image from GHCR instead of compiling
# anything locally -- those images are built on GitHub's runners by
# .github/workflows/release.yml whenever a version tag is pushed. Set
# AEGIS_IMAGE_TAG to pin a specific release (e.g. v0.3.0) instead of
# always tracking :latest.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-aegis_redis_dev}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aegis_redis_dev}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-gateway:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-8080}:8080"
    environment:
      AEGIS_GATEWAY_HTTP_PORT: "8080"
      AEGIS_INPUT_DEFENSE_URL: http://input-defense:8090
      AEGIS_OUTPUT_DEFENSE_URL: http://output-defense:8091
      AEGIS_POLICY_ENGINE_URL: http://policy-engine:8081
      AEGIS_MODEL_ROUTER_URL: http://model-router:8082
      AEGIS_AGENT_GATE_URL: http://agent-gate:8083
      AEGIS_DEFAULT_MODEL: mock-model
      AEGIS_API_KEYS: ${AEGIS_API_KEYS:-}
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}
    depends_on:
      input-defense:
        condition: service_started
      output-defense:
        condition: service_started
      policy-engine:
        condition: service_started
      model-router:
        condition: service_started
      agent-gate:
        condition: service_started

  policy-engine:
    build:
      context: .
      dockerfile: policy-engine/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-policy-engine:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${POLICY_ENGINE_PORT:-8081}:8081"
    environment:
      AEGIS_POLICY_ENGINE_PORT: "8081"
      AEGIS_POLICY_DIR: ${AEGIS_POLICY_DIR:-/etc/aegis/policies}
      AEGIS_AUDIT_URL: http://audit:8084
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}
    volumes:
      - ./policy-engine/policies:/etc/aegis/policies:ro
    depends_on:
      audit:
        condition: service_started

  model-router:
    build:
      context: .
      dockerfile: model-router/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-model-router:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${MODEL_ROUTER_PORT:-8082}:8082"
    env_file:
      - path: .env
        required: false
    environment:
      AEGIS_MODEL_ROUTER_PORT: "8082"
      AEGIS_MODEL_ROUTER_CONFIG: /etc/aegis/model-router/providers.yaml
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}

  agent-gate:
    build:
      context: .
      dockerfile: agent-gate/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-agent-gate:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${AGENT_GATE_PORT:-8083}:8083"
    environment:
      AEGIS_AGENT_GATE_PORT: "8083"
      AEGIS_POLICY_ENGINE_URL: http://policy-engine:8081
      AEGIS_AUDIT_URL: http://audit:8084
      AEGIS_APPROVAL_TTL_HOURS: ${AEGIS_APPROVAL_TTL_HOURS:-24}
      DATABASE_URL: ${DATABASE_URL:-postgres://aegis:aegis_dev@postgres:5432/aegis?sslmode=disable}
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}
      # Service key: lets a calling agent submit tool calls (POST /v1/evaluate).
      AEGIS_AGENT_GATE_API_KEYS: ${AEGIS_AGENT_GATE_API_KEYS:-}
      # Reviewer key: required to decide a pending approval. Deliberately a
      # different credential from the service key above — a calling agent
      # cannot approve its own irreversible action just by holding its own key.
      AEGIS_AGENT_GATE_REVIEWER_KEYS: ${AEGIS_AGENT_GATE_REVIEWER_KEYS:-}
    depends_on:
      policy-engine:
        condition: service_started
      audit:
        condition: service_started
      postgres:
        condition: service_healthy

  audit:
    build:
      context: .
      dockerfile: audit/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-audit:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${AUDIT_PORT:-8084}:8084"
    environment:
      AEGIS_AUDIT_PORT: "8084"
      DATABASE_URL: ${DATABASE_URL:-postgres://aegis:aegis_dev@postgres:5432/aegis?sslmode=disable}
      # Dev-only stable seed (32 bytes base64). Override in production.
      AEGIS_AUDIT_SIGNING_KEY: ${AEGIS_AUDIT_SIGNING_KEY:-YWVnaXMtZGV2LWF1ZGl0LXNpZ25pbmcta2V5LXYxISE=}
      AEGIS_AUDIT_SIGNING_KEY_ID: ${AEGIS_AUDIT_SIGNING_KEY_ID:-dev-key-1}
      # Retired signing keys' public halves, so receipts signed before a
      # rotation stay verifiable -- empty until the first rotation. See
      # scripts/generate-credentials.sh, which maintains this on rotation.
      AEGIS_AUDIT_SIGNING_KEYS_HISTORY: ${AEGIS_AUDIT_SIGNING_KEYS_HISTORY:-}
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}
    depends_on:
      postgres:
        condition: service_healthy

  input-defense:
    build:
      context: .
      dockerfile: input-defense/Dockerfile
      args:
        INSTALL_ML: ${AEGIS_INPUT_DEFENSE_INSTALL_ML:-false}
    image: ghcr.io/hamidmatiny/aegis-input-defense:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${INPUT_DEFENSE_PORT:-8090}:8090"
    environment:
      AEGIS_AUDIT_URL: http://audit:8084
      AEGIS_INPUT_DEFENSE_CLASSIFIER_BACKEND: ${AEGIS_INPUT_DEFENSE_CLASSIFIER_BACKEND:-stub}
      AEGIS_INPUT_DEFENSE_PERPLEXITY_BACKEND: ${AEGIS_INPUT_DEFENSE_PERPLEXITY_BACKEND:-stub}
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}
    depends_on:
      audit:
        condition: service_started

  output-defense:
    build:
      context: .
      dockerfile: output-defense/Dockerfile
      args:
        INSTALL_ML: ${AEGIS_OUTPUT_DEFENSE_INSTALL_ML:-false}
    image: ghcr.io/hamidmatiny/aegis-output-defense:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${OUTPUT_DEFENSE_PORT:-8091}:8091"
    environment:
      AEGIS_OUTPUT_DEFENSE_PORT: "8091"
      AEGIS_AUDIT_URL: http://audit:8084
      AEGIS_MODEL_ROUTER_URL: http://model-router:8082
      AEGIS_OUTPUT_DEFENSE_TOXICITY_BACKEND: ${AEGIS_OUTPUT_DEFENSE_TOXICITY_BACKEND:-stub}
      AEGIS_OUTPUT_DEFENSE_PII_BACKEND: ${AEGIS_OUTPUT_DEFENSE_PII_BACKEND:-regex}
      AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_BACKEND: ${AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_BACKEND:-router}
      AEGIS_OUTPUT_DEFENSE_JUDGE_BACKEND: ${AEGIS_OUTPUT_DEFENSE_JUDGE_BACKEND:-stub}
      AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_PROVIDER: ${AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_PROVIDER:-grok}
      AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_MODEL: ${AEGIS_OUTPUT_DEFENSE_BACKTRANSLATION_MODEL:-grok-4.3}
      AEGIS_OUTPUT_DEFENSE_JUDGE_PROVIDER: ${AEGIS_OUTPUT_DEFENSE_JUDGE_PROVIDER:-grok}
      AEGIS_OUTPUT_DEFENSE_JUDGE_MODEL: ${AEGIS_OUTPUT_DEFENSE_JUDGE_MODEL:-grok-4.3}
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}
    depends_on:
      audit:
        condition: service_started
      model-router:
        condition: service_started

  redteam:
    build:
      context: .
      dockerfile: redteam/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-redteam:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${REDTEAM_PORT:-8092}:8092"
    environment:
      AEGIS_REDTEAM_PORT: "8092"
      AEGIS_REDTEAM_INPUT_DEFENSE_URL: http://input-defense:8090
      AEGIS_REDTEAM_OUTPUT_DEFENSE_URL: http://output-defense:8091
      DATABASE_URL: ${DATABASE_URL:-postgres://aegis:aegis_dev@postgres:5432/aegis?sslmode=disable}
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}
    depends_on:
      input-defense:
        condition: service_started
      output-defense:
        condition: service_started
      postgres:
        condition: service_healthy

  smb-copilot:
    build:
      context: .
      dockerfile: smb-copilot/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-smb-copilot:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    # Localhost-only publish for health checks / gateway-adjacent local curl;
    # gateway reaches the service as http://smb-copilot:8093 on the compose network.
    ports:
      - "127.0.0.1:${SMB_COPILOT_PORT:-8093}:8093"
    environment:
      SMB_COPILOT_PORT: "8093"
      DATABASE_URL: ${DATABASE_URL:-postgres://aegis:aegis_dev@postgres:5432/aegis?sslmode=disable}
      POLICY_ENGINE_URL: http://policy-engine:8081
      AUDIT_SERVICE_URL: http://audit:8084
      MODEL_ROUTER_URL: http://model-router:8082
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:?AEGIS_INTERNAL_TOKEN must be set -- run scripts/generate-credentials.sh}
      SMB_EMBEDDING_PROVIDER: ${SMB_EMBEDDING_PROVIDER:-mock}
      SMB_EMBEDDING_MODEL: ${SMB_EMBEDDING_MODEL:-mock-embedding}
      SMB_CHAT_PROVIDER: ${SMB_CHAT_PROVIDER:-mock}
      SMB_CHAT_MODEL: ${SMB_CHAT_MODEL:-mock-model}
      SMB_QA_RATE_LIMIT: ${SMB_QA_RATE_LIMIT:-5}
      SMB_QA_RATE_WINDOW_SEC: ${SMB_QA_RATE_WINDOW_SEC:-60}
      REDIS_URL: redis://:${REDIS_PASSWORD:-aegis_redis_dev}@redis:6379/0
      AEGIS_POLICY_TENANTS_DIR: /etc/aegis/policies/tenants
    volumes:
      # Writable so register can drop free-tier overrides.yaml; policy-engine
      # mounts the same host tree read-only and hot-reloads / POST /v1/reload.
      - ./policy-engine/policies:/etc/aegis/policies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-router:
        condition: service_started
      policy-engine:
        condition: service_started
      audit:
        condition: service_started

  smb-portal:
    build:
      context: .
      dockerfile: smb-portal/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-smb-portal:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${SMB_PORTAL_PORT:-3001}:3001"
    depends_on:
      smb-copilot:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: ghcr.io/hamidmatiny/aegis-dashboard:${AEGIS_IMAGE_TAG:-latest}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:3000"
    environment:
      AEGIS_DASHBOARD_USER: ${AEGIS_DASHBOARD_USER:-admin}
      AEGIS_DASHBOARD_PASSWORD: ${AEGIS_DASHBOARD_PASSWORD:-}
      # The dashboard's nginx proxy injects these server-side so the browser
      # never sees them; the Approval Inbox is the intended reviewer surface,
      # gated behind dashboard basic auth above. Must match agent-gate's keys.
      AEGIS_AGENT_GATE_API_KEYS: ${AEGIS_AGENT_GATE_API_KEYS:-}
      AEGIS_AGENT_GATE_REVIEWER_KEYS: ${AEGIS_AGENT_GATE_REVIEWER_KEYS:-}
      AEGIS_INTERNAL_TOKEN: ${AEGIS_INTERNAL_TOKEN:-}
    depends_on:
      audit:
        condition: service_started
      policy-engine:
        condition: service_started
      agent-gate:
        condition: service_started
      redteam:
        condition: service_started

volumes:
  postgres_data:
