# SOPS encryption rules for AEGIS's credential backup (Stage B.1).
#
# What this is for: .env holds every generated credential (API keys,
# AEGIS_INTERNAL_TOKEN, POSTGRES_PASSWORD, AEGIS_AUDIT_SIGNING_KEY, ...)
# and is gitignored -- it exists nowhere but the box it was generated on.
# If that disk is lost, every credential is gone with it, and some (like
# POSTGRES_PASSWORD on an already-running database) aren't a clean
# regenerate-and-move-on: see the ALTER USER note in
# scripts/generate-credentials.sh. .env.enc is an encrypted copy of the
# same file, safe to commit to git (or store anywhere) as a real backup --
# decryptable only by whoever holds the age private key below, which is
# never generated by or passed through any script, and never committed.
#
# One-time setup (do this yourself, not via any script):
#   1. Install: brew install age sops   (or your platform's equivalent)
#   2. Generate a keypair:  age-keygen -o age-key.txt
#      This prints a "Public key: age1..." line -- copy that value below,
#      replacing the placeholder. The file age-key.txt IS the private key
#      -- move it somewhere durable and NEVER commit it (a password
#      manager entry is a reasonable place; do not keep it in ~/.ssh next
#      to the same box's other keys -- co-locating the encryption key with
#      what it protects defeats the point of a backup).
#   3. Re-run scripts/generate-credentials.sh -- it will now also produce
#      .env.enc. Commit that file when you're ready.
#
# Recovery (new box, or .env lost on an existing one):
#   export SOPS_AGE_KEY_FILE=/path/to/age-key.txt
#   ./scripts/decrypt-credentials.sh
creation_rules:
  - path_regex: \.env$
    age: age1c77w7tdsz0rlystk9zvg8sg588lx4mhg3a902zd7eqrur5zs6epssfk9zn
    input_type: dotenv
    output_type: dotenv
